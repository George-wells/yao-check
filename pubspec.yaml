name: smart_medication_app
description: 智能用药App - 面向慢性病患者和老年人的用药管理应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1
  get: ^4.6.6

  # 网络请求
  dio: ^5.4.0

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # 路由
  go_router: ^13.0.1

  # UI组件
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.2
  table_calendar: ^3.0.9
  intl: ^0.19.0

  # 工具
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^5.0.2
  image_picker: ^1.0.7
  qr_code_scanner: ^1.0.1
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
