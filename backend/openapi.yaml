openapi: "3.0.3"
info:
  title: 智能用药App API
  description: 智能用药App后端API接口文档 - 支持慢性病患者和老年人的用药管理
  version: "1.0.0"
  contact:
    name: 后端开发团队
    email: backend@smartmed.com

servers:
  - url: http://localhost:3000/api
    description: 本地开发环境
  - url: https://api.smartmed.com/api
    description: 生产环境

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 使用JWT Bearer Token进行认证，通过登录接口获取

  schemas:
    # ========== Common ==========
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
        timestamp:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5
        hasMore:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        timestamp:
          type: string
          format: date-time

    # ========== Auth ==========
    SendCodeRequest:
      type: object
      required:
        - phone
        - purpose
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          example: "13800138000"
          description: 手机号码
        purpose:
          type: string
          enum: [login, register, reset_password, bind_phone]
          example: login
          description: 验证码用途

    LoginRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          example: "13800138000"
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
          description: 短信验证码

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        refreshToken:
          type: string
          example: "a1b2c3d4e5f6..."
        expiresIn:
          type: integer
          example: 900

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenResponse'
        isNewUser:
          type: boolean
          example: false

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    # ========== User ==========
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          example: "138****8000"
        name:
          type: string
          example: "张三"
        avatarUrl:
          type: string
          format: uri
        gender:
          type: string
          enum: [male, female, other]
        birthDate:
          type: string
          format: date
        age:
          type: integer
        isElderlyMode:
          type: boolean
          default: false
        fontScale:
          type: number
          format: float
          default: 1.0
        highContrast:
          type: boolean
          default: false
        enableVoice:
          type: boolean
          default: false
        pushEnabled:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        avatarUrl:
          type: string
          format: uri
        gender:
          type: string
          enum: [male, female, other]
        birthDate:
          type: string
          format: date

    ElderlyPreferencesRequest:
      type: object
      properties:
        isElderlyMode:
          type: boolean
        fontScale:
          type: number
          minimum: 0.8
          maximum: 2.0
        highContrast:
          type: boolean
        enableVoice:
          type: boolean

    MedicationStats:
      type: object
      properties:
        summary:
          type: object
          properties:
            totalDoses:
              type: integer
            completedDoses:
              type: integer
            missedDoses:
              type: integer
            skippedDoses:
              type: integer
            complianceRate:
              type: number
              format: float
            activeDays:
              type: integer
            medicineCount:
              type: integer
        trend:
          type: array
          items:
            type: object
            properties:
              scheduledDate:
                type: string
                format: date
              total:
                type: integer
              completed:
                type: integer
              rate:
                type: number
                format: float

    # ========== Medicine ==========
    Medicine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "阿莫西林胶囊"
        genericName:
          type: string
          example: "阿莫西林"
        category:
          type: string
          example: "抗生素"
        dosageForm:
          type: string
          example: "胶囊剂"
        specification:
          type: string
          example: "0.5g*24粒"
        manufacturer:
          type: string
          example: "华北制药股份有限公司"
        barcode:
          type: string
          example: "6901234567890"
        indications:
          type: string
        usageDosage:
          type: string
        contraindications:
          type: string
        sideEffects:
          type: string
        precautions:
          type: string
        drugInteractions:
          type: string
        plainLanguageExplanation:
          type: string

    InteractionCheckRequest:
      type: object
      required:
        - medicineIds
      properties:
        medicineIds:
          type: array
          minItems: 2
          maxItems: 20
          items:
            type: string
            format: uuid

    InteractionResult:
      type: object
      properties:
        interactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              severity:
                type: string
                enum: [high, medium, low]
              severityLevel:
                type: integer
              description:
                type: string
              mechanism:
                type: string
              clinicalManagement:
                type: string
              symptoms:
                type: string
              medicineAName:
                type: string
              medicineBName:
                type: string
        summary:
          type: object
          properties:
            total:
              type: integer
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer

    # ========== Medication Plan ==========
    ScheduleItem:
      type: object
      required:
        - time
        - daysOfWeek
      properties:
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: "08:00"
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          example: [1, 2, 3, 4, 5, 6, 7]

    CreatePlanRequest:
      type: object
      required:
        - medicineName
        - dosageValue
        - dosageUnit
        - frequencyType
        - schedule
      properties:
        medicineId:
          type: string
          format: uuid
        medicineName:
          type: string
          maxLength: 200
        medicineSpecification:
          type: string
        dosageForm:
          type: string
        dosageValue:
          type: number
          example: 1
        dosageUnit:
          type: string
          enum: [片, 粒, ml, mg, g, 袋, 支, 瓶]
        dosageDescription:
          type: string
          example: "每次1片"
        frequencyType:
          type: string
          enum: [daily, every_n_hours, specific_days, as_needed]
        frequencyInterval:
          type: integer
          minimum: 1
          maximum: 24
        frequencyTimesPerDay:
          type: integer
          minimum: 1
          maximum: 10
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleItem'
          minItems: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        stockQuantity:
          type: number
        stockUnit:
          type: string
        notes:
          type: string
          maxLength: 500

    MedicationPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        medicineId:
          type: string
          format: uuid
        medicineName:
          type: string
        dosageValue:
          type: number
        dosageUnit:
          type: string
        dosageDescription:
          type: string
        frequencyType:
          type: string
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleItem'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    TodaySchedule:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: array
          items:
            type: object
        completed:
          type: array
          items:
            type: object
        missed:
          type: array
          items:
            type: object
        progress:
          type: integer
          example: 60

    # ========== Check-in ==========
    CreateCheckinRequest:
      type: object
      required:
        - planId
        - scheduledDate
        - scheduledTime
        - status
      properties:
        planId:
          type: string
          format: uuid
        scheduledDate:
          type: string
          format: date
        scheduledTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        status:
          type: string
          enum: [taken, skipped, late]
        note:
          type: string
          maxLength: 500
        isMakeup:
          type: boolean
          default: false
        makeupNote:
          type: string

    MedicationLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        medicineName:
          type: string
        dosageDescription:
          type: string
        scheduledTime:
          type: string
        scheduledDate:
          type: string
          format: date
        actualTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, taken, missed, skipped, late]
        delayMinutes:
          type: integer
        note:
          type: string
        isMakeup:
          type: boolean

    # ========== Prescription ==========
    PrescriptionMedicine:
      type: object
      properties:
        name:
          type: string
        dosage:
          type: string
        frequency:
          type: string
        duration:
          type: string

    CreatePrescriptionRequest:
      type: object
      properties:
        doctorName:
          type: string
        doctorTitle:
          type: string
        hospitalName:
          type: string
        department:
          type: string
        prescriptionNumber:
          type: string
        issueDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        diagnosis:
          type: string
        medicines:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionMedicine'
        imageUrl:
          type: string
          format: uri
        notes:
          type: string

    Prescription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        doctorName:
          type: string
        hospitalName:
          type: string
        issueDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        diagnosis:
          type: string
        medicines:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionMedicine'
        status:
          type: string
          enum: [active, expired, archived]
        ocrStatus:
          type: string
          enum: [pending, processing, completed, failed]
        createdAt:
          type: string
          format: date-time

    # ========== Guardian ==========
    CreateGuardianRequest:
      type: object
      required:
        - patientId
        - relationship
      properties:
        patientId:
          type: string
          format: uuid
        relationship:
          type: string
          enum: [spouse, child, parent, sibling, relative, caregiver, other]
        notes:
          type: string

    ConfirmGuardianRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [accept, reject]

    GuardianPatient:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        patientName:
          type: string
        relationship:
          type: string
        todaySummary:
          type: object
          properties:
            total:
              type: integer
            completed:
              type: integer
            missed:
              type: integer

    GuardianReport:
      type: object
      properties:
        patient:
          type: object
        relationship:
          type: string
        summary:
          type: object
          properties:
            totalDoses:
              type: integer
            completedDoses:
              type: integer
            missedDoses:
              type: integer
            complianceRate:
              type: number
        trend:
          type: array
          items:
            type: object

    # ========== Notification ==========
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        notificationType:
          type: string
        title:
          type: string
        body:
          type: string
        data:
          type: object
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    RegisterDeviceRequest:
      type: object
      required:
        - deviceToken
        - platform
      properties:
        deviceToken:
          type: string
        platform:
          type: string
          enum: [ios, android, web]
        deviceName:
          type: string

paths:
  # ========== Auth ==========
  /auth/send-code:
    post:
      tags: [认证管理]
      summary: 发送短信验证码
      description: 向指定手机号发送验证码，用于登录、注册等场景
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
      responses:
        '200':
          description: 验证码已发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '429':
          description: 请求过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [认证管理]
      summary: 手机号验证码登录
      description: 使用手机号和验证码登录，新用户自动注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 验证码错误或已过期

  /auth/refresh:
    post:
      tags: [认证管理]
      summary: 刷新访问令牌
      description: 使用刷新令牌获取新的访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 令牌刷新成功

  /auth/logout:
    post:
      tags: [认证管理]
      summary: 退出登录
      description: 撤销所有刷新令牌
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 已退出登录

  # ========== Users ==========
  /users/profile:
    get:
      tags: [用户管理]
      summary: 获取用户个人信息
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    put:
      tags: [用户管理]
      summary: 更新用户个人信息
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 个人信息已更新

  /users/elderly-preferences:
    put:
      tags: [用户管理]
      summary: 更新适老化偏好设置
      description: 一键切换适老化模式、调整字体大小、对比度、语音设置
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElderlyPreferencesRequest'
      responses:
        '200':
          description: 适老化偏好已更新

  /users/stats:
    get:
      tags: [用户管理]
      summary: 获取用药统计数据
      description: 获取用户的用药依从率、趋势等统计数据
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
          description: 统计天数
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MedicationStats'

  # ========== Medicines ==========
  /medicines:
    get:
      tags: [药品信息]
      summary: 搜索药品
      description: 按药品名称、通用名搜索药品，支持模糊搜索
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Medicine'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /medicines/{id}:
    get:
      tags: [药品信息]
      summary: 获取药品详情
      description: 获取药品完整信息，包括说明书
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Medicine'

  /medicines/barcode/{code}:
    get:
      tags: [药品信息]
      summary: 条码查询药品
      description: 通过药品包装条码查询药品信息
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: 药品条码
      responses:
        '200':
          description: 成功

  /medicines/interactions:
    post:
      tags: [药品信息]
      summary: 药物相互作用检查
      description: 检查多种药物同时服用的相互作用风险
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionCheckRequest'
      responses:
        '200':
          description: 检查完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/InteractionResult'

  # ========== Plans ==========
  /plans:
    get:
      tags: [用药计划]
      summary: 获取用药计划列表
      security:
        - BearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 成功
    post:
      tags: [用药计划]
      summary: 创建用药计划
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: 用药计划已创建

  /plans/today:
    get:
      tags: [用药计划]
      summary: 获取今日用药安排
      description: 获取用户今日待服药、已完成、已漏服的列表及进度
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TodaySchedule'

  /plans/{id}:
    get:
      tags: [用药计划]
      summary: 获取用药计划详情
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
    put:
      tags: [用药计划]
      summary: 更新用药计划
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 用药计划已更新
    delete:
      tags: [用药计划]
      summary: 删除用药计划
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 用药计划已删除

  # ========== Check-ins ==========
  /checkins:
    post:
      tags: [用药打卡]
      summary: 服药打卡
      description: 记录服药打卡，支持正常服药、补服、跳过
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckinRequest'
      responses:
        '201':
          description: 打卡成功
    get:
      tags: [用药打卡]
      summary: 获取打卡记录
      description: 按日期范围获取打卡记录列表
      security:
        - BearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 成功

  /checkins/{id}/undo:
    post:
      tags: [用药打卡]
      summary: 撤销打卡
      description: 5分钟内可撤销打卡记录
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 打卡已撤销

  /checkins/calendar:
    get:
      tags: [用药打卡]
      summary: 获取日历视图数据
      description: 按年月获取每日打卡统计
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 成功

  # ========== Prescriptions ==========
  /prescriptions:
    get:
      tags: [处方管理]
      summary: 获取处方列表
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
    post:
      tags: [处方管理]
      summary: 创建处方
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrescriptionRequest'
      responses:
        '201':
          description: 处方已创建

  /prescriptions/{id}:
    get:
      tags: [处方管理]
      summary: 获取处方详情
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
    put:
      tags: [处方管理]
      summary: 更新处方
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 处方已更新
    delete:
      tags: [处方管理]
      summary: 删除处方
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 处方已删除

  /prescriptions/{id}/ocr:
    post:
      tags: [处方管理]
      summary: 提交OCR识别
      description: 上传处方图片进行OCR识别
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - imageUrl
              properties:
                imageUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: OCR识别已提交

  # ========== Guardians ==========
  /guardians:
    post:
      tags: [家人监护]
      summary: 发送监护邀请
      description: 创建监护关系，向被监护人发送邀请
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuardianRequest'
      responses:
        '201':
          description: 监护邀请已发送

  /guardians/patients:
    get:
      tags: [家人监护]
      summary: 获取被监护人列表
      description: 监护人查看所有被监护人的用药摘要
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuardianPatient'

  /guardians/my-guardians:
    get:
      tags: [家人监护]
      summary: 获取我的监护人列表
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /guardians/invitations:
    get:
      tags: [家人监护]
      summary: 获取待确认的监护邀请
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /guardians/{patientId}/confirm:
    put:
      tags: [家人监护]
      summary: 确认/拒绝监护邀请
      security:
        - BearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmGuardianRequest'
      responses:
        '200':
          description: 操作成功

  /guardians/{patientId}:
    delete:
      tags: [家人监护]
      summary: 解除监护关系
      security:
        - BearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 监护关系已解除

  /guardians/{patientId}/report:
    get:
      tags: [家人监护]
      summary: 获取被监护人用药报告
      description: 获取指定时间范围内的用药依从率报告
      security:
        - BearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: days
          in: query
          schema:
            type: integer
            default: 7
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GuardianReport'

  # ========== Notifications ==========
  /notifications:
    get:
      tags: [通知管理]
      summary: 获取通知列表
      security:
        - BearerAuth: []
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: 成功

  /notifications/unread-count:
    get:
      tags: [通知管理]
      summary: 获取未读通知数量
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功

  /notifications/{id}/read:
    put:
      tags: [通知管理]
      summary: 标记通知为已读
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 已标记为已读

  /notifications/read-all:
    put:
      tags: [通知管理]
      summary: 全部标记为已读
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 全部标记为已读

  /notifications/device:
    post:
      tags: [通知管理]
      summary: 注册设备推送令牌
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: 设备已注册

  # ========== Health ==========
  /health:
    get:
      tags: [系统]
      summary: 健康检查
      responses:
        '200':
          description: 服务运行正常
